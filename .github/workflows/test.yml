name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install esphome
      - name: Validate ESPHome config compiles
        run: |
          cp secrets.yaml.example secrets.yaml
          esphome compile moen-puck.yaml
